plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

static def gitRevision() {
    return "git rev-parse --short HEAD".execute().text.trim()
}

static def getGitBranchName() {
    def branchName = "unknown"
    branchName = 'git rev-parse --abbrev-ref HEAD'.execute().text.replaceAll("/", "-").trim()
    return branchName
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def dateFormat = localProperties.getProperty("dateFormat") ?: "yyyy-MM-dd"
def releaseTime = {
    return new Date().format(dateFormat)
}

android {
    namespace "com.echatsoft.echatsdk.echat_platform_flutter_sdk_example"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.echatsoft.echatsdk.echat_platform_flutter_sdk_example"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        multiDexEnabled true
        multiDexKeepProguard file('multidex-config.pro')
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                output.outputFileName = "echat-platform-flutter-sdk-example-${variant.versionName}-${releaseTime()}-${getGitBranchName()}-${gitRevision()}-${variant.name}.apk"
            }
        }

        variant.assembleProvider.configure {
            // 获得Android下的APK输出目录 ${buildDir}/outputs/apk/${variant.name}
            it.doLast {
                variant.outputs.each { output ->
                    println("APK Output -> ${output.outputFile}")
                }
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
